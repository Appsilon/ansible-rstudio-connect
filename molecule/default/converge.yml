---
- name: Converge
  hosts: all
  pre_tasks:
    - name: Include vars
      ansible.builtin.include_vars: "{{ playbook_dir }}/../../tests/vars/main.yml"
    - name: Pin older Connect version for Ubuntu 20.04
      ansible.builtin.set_fact:
        rstudio_connect_version: "2025.04.0"
      when: ansible_distribution_release == 'focal'
  roles:
    - ../../../
