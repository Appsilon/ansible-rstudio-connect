---
name: CI
'on':
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 3'
jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip install ansible-lint[community,yamllint]

      - name: Lint code
        run: |
          yamllint .
          ansible-lint

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "${{ github.repository }}"
    needs:
      - lint
    strategy:
      fail-fast: false
      matrix:
        scenario: [default, with-python]
        distro: [ubuntu2004, ubuntu2204, ubuntu2404, ubuntu2604, rockylinux8, rockylinux9, rockylinux10]
        ansible-version: ['>=2.11.5']
        exclude:
          - distro: ubuntu2004
            scenario: default
          - distro: ubuntu2004
            scenario: with-python
          - distro: rockylinux8
            scenario: default
          - distro: rockylinux8
            scenario: with-python
        include:
          - distro: ubuntu2004
            scenario: default
            ansible-version: '>=2.11.5,<2.17'
          - distro: ubuntu2004
            scenario: with-python
            ansible-version: '>=2.11.5,<2.17'
          - distro: rockylinux8
            scenario: default
            ansible-version: '>=2.11.5,<2.17'
          - distro: rockylinux8
            scenario: with-python
            ansible-version: '>=2.11.5,<2.17'

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4
        with:
          path: "${{ github.repository }}"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip install 'ansible-core${{ matrix.ansible-version }}' molecule molecule-plugins[docker] docker

      - name: Run Molecule tests
        run: |
          molecule test -s "${{ matrix.scenario }}"
        env:
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '2'
          MOLECULE_DEBUG: '1'
          MOLECULE_DISTRO: "${{ matrix.distro }}"
          PY_COLORS: '1'
